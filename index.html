<!DOCTYPE html>
<html>
<head>
  <title>Trade Ledger</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <h1>⚖ Trade Ledger</h1>
    </div>
    <button id="dm-button">DM setup</button>
  </header>
  <div class="page-wrapper">
    <em class="running-head">Ledger of Chambers</em>
    <h1 class="fleuron">Prices Current</h2>
    <table>
    <thead>
      <tr>
        <th>Commodity</th>
        <th>Going rate</th>
        <th>Grovedwood</th>
        <th>Bronzesire</th>
        <th>Callyaus</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Lumber</td>
        <td>2</td>
        <td>2</td>
        <td>2</td>
        <td>2</td>
      </tr>
      <tr>
        <td>Stone</td>
        <td>4</td>
        <td>4</td>
        <td>4</td>
        <td>4</td>
      </tr>
      <tr>
        <td>Food</td>
        <td>1</td>
        <td>1</td>
        <td>1</td>
        <td>1</td>
      </tr>
      <tr>
        <td>Iron</td>
        <td>6</td>
        <td>6</td>
        <td>6</td>
        <td>6</td>
      </tr>
      <tr>
        <td>Leather</td>
        <td>3</td>
        <td>3</td>
        <td>3</td>
        <td>3</td>
      </tr>
      <tr>
        <td>Fabric</td>
        <td>3</td>
        <td>3</td>
        <td>3</td>
        <td>3</td>
      </tr>
      <tr>
        <td>Funds</td>
        <td></td>
        <td>400</td>
        <td>400</td>
        <td>400</td>
      </tr>
    </tbody>
  </table>

  <p class="footer">✦ ✦ ✦</p>

      
    

  </div>
  <script src="app.js"></script>
</body>
</html>
