<!DOCTYPE html>
<html>
<head>
  <title>Trade Ledger</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <h1>⚖ Trade Ledger</h1>
    </div>
    <nav class="page-nav">
      <a href="#prices">Prices Current</a>
      <a href="#holdings">Holdings</a>
      <a href="#report">Weekly Report</a>
      <a href="#dm">DM Setup</a>
    </nav>
  </header>

  <div class="page-wrapper">
    <em class="running-head">Ledger of Chambers</em>

    <!-- Prices Current Page -->
    <div id="page-prices">
      <h1 class="fleuron">Prices Current</h1>
      <table class="prices" id="prices"></table>
      <p class="key">Prices in <span class="selling">red</span> are goods the town is selling.</p>
    </div>

    <!-- Holdings Page -->
    <div id="page-holdings" hidden>
      <h1 class="fleuron">Holdings</h1>
      <p>Coming soon.</p>
    </div>

    <!-- Report Page -->
    <div id="page-report" hidden>
      <h1 class="fleuron">Weekly Report</h1>
      <p>Coming soon.</p>
    </div>

    <!-- Editing Page -->
    <div id="page-dm" hidden></div>

    <p class="footer">✦ ✦ ✦</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
