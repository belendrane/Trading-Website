<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <h1>⚖ Trade Ledger</h1>
    </div>
    <button id="dm-button">DM setup</button>

  <div class="container">

      <div class="layout" id="towns"></div>
      <button id="add-town" class="add-town" hidden>+ Add town</button>
    </div>
    <div class="right">
      <div class="box">
        <h3>Treasurey</h3>
        <p>stuff n' loot</p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
